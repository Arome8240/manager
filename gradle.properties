# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships Kotlin support built in and, by default, forbids the classic
# org.jetbrains.kotlin.android plugin. Opt out of both so this project keeps
# using the standard Kotlin Gradle plugin + Compose compiler plugin (the same
# combination SceneView's own build uses to consume arsceneview 4.34.0).
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
